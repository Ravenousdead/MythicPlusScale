<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guild Mythic+ Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12151d;
    --surface: #1a1e29;
    --surface-raised: #202536;
    --border: #2b3245;
    --border-strong: #3a4258;
    --text-primary: #e9e7e0;
    --text-secondary: #9aa2b8;
    --text-muted: #6b7288;
    --gold: #c9a961;
    --gold-dim: #8a7440;
    --danger: #e2504a;
    --track-low: #2b3245;
    --track-high: #c9a961;
    --radius: 10px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, sans-serif;
    padding: 32px 20px 80px;
  }
  .page{ max-width: 920px; margin: 0 auto; }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  h1{
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 0.02em;
    color: var(--gold);
    margin: 0 0 4px;
  }
  .subtitle{
    color: var(--text-muted);
    font-size: 13px;
    margin: 0;
  }
  #refreshBtn{
    background: var(--surface-raised);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
    border-radius: var(--radius);
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  #refreshBtn:hover{ border-color: var(--gold-dim); }
  #refreshBtn:disabled{ opacity: 0.5; cursor: default; }
  #refreshBtn svg{ width:14px; height:14px; }

  /* ---------- stat cards ---------- */
  .stats{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 36px;
  }
  .stat-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat-label{
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .stat-value{
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    color: var(--gold);
  }
  .stat-value.small{ font-size: 15px; font-weight: 500; color: var(--text-primary); }

  /* ---------- team sections ---------- */
  .team-section{ margin-bottom: 32px; }
  .team-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 10px;
  }
  .team-header h2{
    font-family: 'Cinzel', serif;
    font-weight: 500;
    font-size: 17px;
    margin: 0;
    color: var(--text-primary);
  }
  .sort-buttons{ display:flex; gap:6px; }
  .sort-btn{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
  }
  .sort-btn.active{ border-color: var(--gold-dim); color: var(--gold); }

  .axis-labels{
    display:flex;
    padding: 0 16px 0 172px;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .roster-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .player-row{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 12px 16px;
    border-left: 3px solid var(--border-strong);
    border-top: 1px solid var(--border);
  }
  .player-row:first-child{ border-top: none; }
  .player-row.error{ border-left-color: var(--danger); }

  .avatar{
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--surface-raised);
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
    border: 1px solid var(--border-strong);
  }
  .id-col{ flex: 0 0 130px; min-width: 0; }
  .id-col .name{ font-size: 14px; font-weight: 500; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .id-col .class-label{ font-size: 11px; margin: 0; }
  .id-col .role-label{ font-size: 10px; margin: 2px 0 0; text-transform: uppercase; letter-spacing: 0.03em; opacity: 0.85; }

  .score-col{ flex: 0 0 78px; }
  .score-col .score{ font-size: 14px; font-weight: 600; margin: 0; }
  .score-col .rank{ font-size: 11px; color: var(--text-secondary); margin: 0; }

  .track{ flex: 1; position: relative; height: 46px; min-width: 0; }
  .track .line{ position:absolute; top:50%; left:0; right:0; height:1px; background: var(--border); }
  .dungeon-pip{
    position:absolute; top:50%;
    width: 33px; height: 33px;
    border-radius: 50%;
    transform: translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    font-size: 13px; font-weight: 600;
    border: 1px solid var(--surface);
    cursor: default;
  }

  .error-msg{ font-size: 12px; color: var(--danger); margin: 0; }

  /* ---------- skeleton ---------- */
  .skeleton-row{ padding: 12px 16px; border-top: 1px solid var(--border); }
  .skeleton-row:first-child{ border-top: none; }
  .skel{
    background: linear-gradient(90deg, var(--surface-raised) 25%, var(--border) 50%, var(--surface-raised) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 6px;
    height: 14px;
  }
  @keyframes shimmer{ from{ background-position: 200% 0; } to{ background-position: -200% 0; } }

  footer{
    text-align:center;
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 40px;
  }

  @media (max-width: 560px){
    .player-row{ flex-wrap: wrap; }
    .track{ flex: 1 1 100%; order: 3; margin-top: 8px; }
    .axis-labels{ padding-left: 16px; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div>
      <h1>Guild Mythic+ Tracker</h1>
      <p class="subtitle" id="updatedText">Loading...</p>
    </div>
    <button id="refreshBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v6h-6"/></svg>
      Refresh
    </button>
  </header>

  <div class="stats" id="statsRow"></div>

  <div id="teamsContainer"></div>

</div>

<footer>Data from raider.io. Scores cached locally for <span id="cacheMinsText"></span> minutes.</footer>

<script>
/* =====================================================================
   CONFIG — this is the only section you should need to touch each
   season, or whenever someone's main changes / transfers / renames.
   Just paste their raider.io profile URL into the right list.
   ===================================================================== */
const CONFIG = {
  season: "season-mn-1",      // <-- update at the start of each season
  region: "us",
  cacheMinutes: 10,

  teams: [
    {
      name: "A team",
      urls: [
        "https://raider.io/characters/us/moon-guard/Damshethicc",
        "https://raider.io/characters/us/proudmoore/Valont",
        "https://raider.io/characters/us/proudmoore/Zelaren",
        "https://raider.io/characters/us/proudmoore/Kostility",
        "https://raider.io/characters/us/sargeras/M%C3%A1xwell"
      ]
    },
    {
      name: "Night crew",
      urls: [
        "https://raider.io/characters/us/proudmoore/Louhjin",
        "https://raider.io/characters/us/proudmoore/Zelotry",
        "https://raider.io/characters/us/sargeras/Shtoopie",
        "https://raider.io/characters/us/silver-hand/Cenjeru",
        "https://raider.io/characters/us/sargeras/Zarmage"
      ]
    }
  ],

  notableMentions: [
    "https://raider.io/characters/us/scarlet-crusade/Samsonknight",
    "https://raider.io/characters/us/sargeras/Zieavqdh"
  ]
};

/* =====================================================================
   Class colors (official WoW class colors, used for the left border
   accent + class label so rosters are instantly scannable)
   ===================================================================== */
const ROLE_COLORS = { tank: "#4d8fd6", healer: "#4dbd74", dps: "#d65c5c" };
const ROLE_LABELS = { tank: "Tank", healer: "Healer", dps: "DPS" };

// raider.io's mythic_plus_scores_by_season already breaks score down by
// role (scores.tank / scores.healer / scores.dps) — no extra API call
// needed. We just take whichever role has the highest score as their main.
function getPlayerRole(d){
  const scores = d.mythic_plus_scores_by_season?.[0]?.scores;
  if(!scores) return null;
  const roles = { tank: scores.tank || 0, healer: scores.healer || 0, dps: scores.dps || 0 };
  let best = null, bestVal = 0;
  for(const [role, val] of Object.entries(roles)){
    if(val > bestVal){ bestVal = val; best = role; }
  }
  return best;
}

const CLASS_COLORS = {
  "Death Knight": "#C41F3B", "Demon Hunter": "#A330C9", "Druid": "#FF7D0A",
  "Evoker": "#33937F", "Hunter": "#ABD473", "Mage": "#40C7EB",
  "Monk": "#00FF96", "Paladin": "#F58CBA", "Priest": "#E3E3E3",
  "Rogue": "#FFF569", "Shaman": "#0070DE", "Warlock": "#8787ED",
  "Warrior": "#C79C6E"
};

/* =====================================================================
   Small cache layer (localStorage + TTL) so a page refresh doesn't
   re-hit raider.io for every player every time.
   ===================================================================== */
const Cache = {
  get(key){
    try{
      const raw = localStorage.getItem(key);
      if(!raw) return null;
      const { value, expires } = JSON.parse(raw);
      if(Date.now() > expires) { localStorage.removeItem(key); return null; }
      return value;
    }catch(e){ return null; }
  },
  set(key, value, minutes){
    try{
      localStorage.setItem(key, JSON.stringify({ value, expires: Date.now() + minutes*60000 }));
    }catch(e){ /* storage full or disabled — fail silently, just skip caching */ }
  },
  clearAll(){
    Object.keys(localStorage)
      .filter(k => k.startsWith("mplus_"))
      .forEach(k => localStorage.removeItem(k));
  }
};

/* =====================================================================
   API helpers
   ===================================================================== */
function parseProfileUrl(url){
  const parts = url.split("/");
  const i = parts.indexOf("characters");
  return { region: parts[i+1], realm: parts[i+2], name: decodeURIComponent(parts[i+3]) };
}

async function fetchJSON(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

// One combined call per player instead of three separate ones.
async function fetchPlayer(url){
  const cacheKey = "mplus_player_" + url;
  const cached = Cache.get(cacheKey);
  if(cached) return cached;

  const { region, realm, name } = parseProfileUrl(url);
  const fields = "mythic_plus_scores_by_season:current,mythic_plus_best_runs,mythic_plus_ranks,class,thumbnail_url";
  const apiUrl = `https://raider.io/api/v1/characters/profile?region=${region}&realm=${realm}&name=${encodeURIComponent(name)}&fields=${fields}`;

  const data = await fetchJSON(apiUrl);
  if(data.error || !data.mythic_plus_scores_by_season){
    throw new Error(data.message || "No mythic+ data found for " + name);
  }
  Cache.set(cacheKey, data, CONFIG.cacheMinutes);
  return data;
}

async function fetchCutoffs(){
  const cacheKey = "mplus_cutoffs_" + CONFIG.season;
  const cached = Cache.get(cacheKey);
  if(cached) return cached;
  const url = `https://raider.io/api/v1/mythic-plus/season-cutoffs?season=${CONFIG.season}&region=${CONFIG.region}`;
  const data = await fetchJSON(url);
  Cache.set(cacheKey, data, CONFIG.cacheMinutes);
  return data;
}

/* =====================================================================
   Rendering
   ===================================================================== */
function renderSkeleton(){
  const container = document.getElementById("teamsContainer");
  container.innerHTML = "";
  [...CONFIG.teams, { name: "Notable mentions", urls: CONFIG.notableMentions }].forEach(team => {
    const section = document.createElement("div");
    section.className = "team-section";
    const card = document.createElement("div");
    card.className = "roster-card";
    team.urls.forEach(() => {
      const row = document.createElement("div");
      row.className = "skeleton-row";
      row.innerHTML = `<div class="skel" style="width:40%"></div>`;
      card.appendChild(row);
    });
    section.innerHTML = `<div class="team-header"><h2>${team.name}</h2></div>`;
    section.appendChild(card);
    container.appendChild(section);
  });
}

function computeGlobalRange(allPlayerData){
  let high = 0, low = 1000, total = 0, count = 0;
  allPlayerData.forEach(p => {
    if(p.error) return;
    (p.data.mythic_plus_best_runs || []).forEach(run => {
      if(run.score > high) high = run.score;
      if(run.score < low) low = run.score;
      total += run.score; count++;
    });
  });
  if(count === 0) return { low: 0, high: 1 };
  const avg = total / count;
  if(high - low > 30){
    return { low: avg - 15, high: avg + 15 };
  }
  return { low, high };
}

function scoreToColor(pct){
  // pct 0-1 across the gold accent ramp, dark surface -> gold
  const stops = [
    { p: 0,   c: [43,50,69]   },
    { p: 0.5, c: [110,95,60]  },
    { p: 1,   c: [201,169,97] }
  ];
  let a = stops[0], b = stops[stops.length-1];
  for(let i=0; i<stops.length-1; i++){
    if(pct >= stops[i].p && pct <= stops[i+1].p){ a = stops[i]; b = stops[i+1]; break; }
  }
  const span = (b.p - a.p) || 1;
  const t = (pct - a.p) / span;
  const c = a.c.map((v,i) => Math.round(v + (b.c[i]-v)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function buildPlayerRow(entry, range, totalPopulationCount){
  const row = document.createElement("div");

  if(entry.error){
    row.className = "player-row error";
    const { name } = parseProfileUrl(entry.url);
    row.innerHTML = `
      <div class="id-col">
        <p class="name">${name}</p>
        <p class="error-msg">Couldn't load — ${entry.errorMessage}</p>
      </div>`;
    return row;
  }

  const d = entry.data;
  const className = d.class || "";
  const color = CLASS_COLORS[className] || "#888";
  const role = getPlayerRole(d);
  const roleColor = ROLE_COLORS[role] || "#888";
  const roleLabel = ROLE_LABELS[role] || "";
  const scoreObj = d.mythic_plus_scores_by_season[0];
  const score = scoreObj ? Math.round(scoreObj.scores.all) : "—";
  const regionRank = d.mythic_plus_ranks && d.mythic_plus_ranks.overall ? d.mythic_plus_ranks.overall.region : null;
  const pct = (regionRank && totalPopulationCount) ? (regionRank / totalPopulationCount * 100).toFixed(1) + "%" : "—";

  row.className = "player-row";
  row.style.borderLeftColor = color;

  const runs = (d.mythic_plus_best_runs || []);
  const trackPips = runs.map(run => {
    let pct01 = (run.score - range.low) / (range.high - range.low || 1);
    pct01 = Math.max(0, Math.min(1, pct01));
    const leftPct = 5 + pct01 * 90; // keep pips within padded bounds so they don't clip edges
    const bg = scoreToColor(pct01);
    const label = run.short_name || (run.dungeon || "").split(" ").map(w=>w[0]).join("").slice(0,3).toUpperCase();
    const textColor = pct01 > 0.6 ? "#1a1408" : "#e9e7e0";
    return `<div class="dungeon-pip" title="${run.dungeon} — ${run.score} (+${run.num_keystone_upgrades || 0})"
              style="left:${leftPct}%; background:${bg}; color:${textColor};">${label}</div>`;
  }).join("");

  row.innerHTML = `
    <div class="avatar" style="background-image:url('${d.thumbnail_url || ""}')"></div>
    <div class="id-col">
      <p class="name">${d.name}</p>
      <p class="class-label" style="color:${color}">${className}</p>
      ${roleLabel ? `<p class="role-label" style="color:${roleColor}">${roleLabel}</p>` : ""}
    </div>
    <div class="score-col">
      <p class="score">${score}</p>
      <p class="rank">top ${pct}</p>
    </div>
    <div class="track">
      <div class="line"></div>
      ${trackPips}
    </div>
  `;
  return row;
}

const ROLE_SORT_ORDER = { tank: 0, healer: 1, dps: 2 };

function sortEntries(entries, mode){
  const withScore = entries.map(e => ({
    entry: e,
    score: e.error ? -1 : (e.data.mythic_plus_scores_by_season[0]?.scores.all ?? -1),
    name: e.error ? parseProfileUrl(e.url).name : e.data.name,
    role: e.error ? null : getPlayerRole(e.data)
  }));
  if(mode === "score-desc") withScore.sort((a,b) => b.score - a.score);
  if(mode === "score-asc") withScore.sort((a,b) => a.score - b.score);
  if(mode === "name") withScore.sort((a,b) => a.name.localeCompare(b.name));
  if(mode === "role") withScore.sort((a,b) => {
    const ra = ROLE_SORT_ORDER[a.role] ?? 3;
    const rb = ROLE_SORT_ORDER[b.role] ?? 3;
    if(ra !== rb) return ra - rb;
    return b.score - a.score; // best score first within the same role
  });
  return withScore.map(w => w.entry);
}

function renderTeamSection(container, teamName, entries, range, totalPopulationCount, sortMode){
  const section = document.createElement("div");
  section.className = "team-section";

  const header = document.createElement("div");
  header.className = "team-header";
  header.innerHTML = `<h2>${teamName}</h2>`;

  const sortWrap = document.createElement("div");
  sortWrap.className = "sort-buttons";
  [["score-desc","Score"],["role","Role"],["name","Name"]].forEach(([mode,label]) => {
    const btn = document.createElement("button");
    btn.className = "sort-btn" + (sortMode === mode ? " active" : "");
    btn.textContent = label;
    btn.onclick = () => { teamSortState[teamName] = mode; renderAll(); };
    sortWrap.appendChild(btn);
  });
  header.appendChild(sortWrap);
  section.appendChild(header);

  const axisLabels = document.createElement("div");
  axisLabels.className = "axis-labels";
  axisLabels.innerHTML = `<span>lowest run (${Math.round(range.low)})</span><span>highest run (${Math.round(range.high)})</span>`;
  section.appendChild(axisLabels);

  const card = document.createElement("div");
  card.className = "roster-card";
  sortEntries(entries, sortMode).forEach(entry => {
    card.appendChild(buildPlayerRow(entry, range, totalPopulationCount));
  });
  section.appendChild(card);

  container.appendChild(section);
}

const teamSortState = {};

let lastData = null; // { entries: [{url, data|error}], cutoffs }

function renderAll(){
  if(!lastData) return;
  const { allEntries, cutoffs } = lastData;
  // Axis bounds are based on the two teams only — notable mentions are
  // shown on this same axis but don't stretch or shrink it.
  const teamUrls = CONFIG.teams.flatMap(t => t.urls);
  const teamEntries = allEntries.filter(e => teamUrls.includes(e.url));
  const range = computeGlobalRange(teamEntries);
  const totalPopulationCount = cutoffs?.cutoffs?.p990?.all?.totalPopulationCount;

  const container = document.getElementById("teamsContainer");
  container.innerHTML = "";

  CONFIG.teams.forEach(team => {
    const entries = allEntries.filter(e => team.urls.includes(e.url));
    const mode = teamSortState[team.name] || "score-desc";
    renderTeamSection(container, team.name, entries, range, totalPopulationCount, mode);
  });

  const nmEntries = allEntries.filter(e => CONFIG.notableMentions.includes(e.url));
  const nmMode = teamSortState["Notable mentions"] || "score-desc";
  renderTeamSection(container, "Notable mentions", nmEntries, range, totalPopulationCount, nmMode);
}

function renderStats(cutoffs){
  const statsRow = document.getElementById("statsRow");
  statsRow.innerHTML = "";
  if(!cutoffs || !cutoffs.cutoffs || !cutoffs.cutoffs.p990){
    statsRow.innerHTML = `<div class="stat-card"><p class="stat-label">Top 1% cutoff</p><p class="stat-value small">Unavailable</p></div>`;
    return;
  }
  const p990 = cutoffs.cutoffs.p990.all;
  const cutoffScore = Math.round(p990.quantileMinValue);

  const increaseLevelBy = (cutoffScore - 2920) / 8 / 15;
  const baseLevel = 12 + Math.floor(increaseLevelBy);
  const nextCount = Math.ceil((increaseLevelBy - Math.floor(increaseLevelBy)) * 8);
  const keyLevelStr = `${baseLevel}s, then ${nextCount}x ${baseLevel+1}s`;

  statsRow.innerHTML = `
    <div class="stat-card">
      <p class="stat-label">Top 1% cutoff</p>
      <p class="stat-value">${cutoffScore}</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Roughly equivalent to</p>
      <p class="stat-value small">${keyLevelStr}</p>
    </div>
  `;
}

/* =====================================================================
   Main load flow
   ===================================================================== */
async function loadAll(){
  document.getElementById("refreshBtn").disabled = true;
  document.getElementById("cacheMinsText").textContent = CONFIG.cacheMinutes;
  renderSkeleton();

  const allUrls = [
    ...CONFIG.teams.flatMap(t => t.urls),
    ...CONFIG.notableMentions
  ];

  const [cutoffsResult, ...playerResults] = await Promise.allSettled([
    fetchCutoffs(),
    ...allUrls.map(url => fetchPlayer(url))
  ]);

  const cutoffs = cutoffsResult.status === "fulfilled" ? cutoffsResult.value : null;

  const allEntries = allUrls.map((url, i) => {
    const r = playerResults[i];
    if(r.status === "fulfilled") return { url, data: r.value, error: false };
    return { url, error: true, errorMessage: r.reason?.message || "unknown error" };
  });

  lastData = { allEntries, cutoffs };
  renderStats(cutoffs);
  renderAll();

  document.getElementById("updatedText").textContent = "Last updated " + new Date().toLocaleTimeString();
  document.getElementById("refreshBtn").disabled = false;
}

document.getElementById("refreshBtn").addEventListener("click", () => {
  Cache.clearAll();
  loadAll();
});

loadAll();
</script>
</body>
</html>
